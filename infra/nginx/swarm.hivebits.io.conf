# Swarm mini app. Isti obrazac kao ostali hivebits sajtovi:
# ovo je samo http blok, a `certbot --nginx` posle doda HTTPS.
# Aplikacija slusa samo na 127.0.0.1:3800 (pm2: swarm-app), spolja je vidljiva
# iskljucivo kroz ovaj proxy.
server {
    server_name swarm.hivebits.io;

    location / {
        proxy_pass http://127.0.0.1:3800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
